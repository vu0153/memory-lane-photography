<svg width="680" height="400" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ML Photography Logo</title>
  <desc>Logo dịch vụ chụp ảnh ML với biểu tượng máy ảnh và tên thương hiệu</desc>
  <defs>
    <style>
      .logo-text { font-family: Georgia, serif; fill: #1a1a2e; letter-spacing: 2px; }
      .tagline { font-family: Arial, sans-serif; fill: #888; letter-spacing: 6px; }
    </style>
  </defs>

  <!-- Background trắng -->
  <rect width="680" height="400" fill="#ffffff" />

  <!-- Camera body -->
  <rect x="240" y="115" width="200" height="145" rx="18" fill="#1a1a2e" />

  <!-- Camera top bump (viewfinder) -->
  <rect x="290" y="100" width="80" height="25" rx="8" fill="#1a1a2e" />

  <!-- Shutter button -->
  <circle cx="350" cy="103" r="9" fill="#d4af37" />

  <!-- Lens outer ring -->
  <circle cx="340" cy="187" r="52" fill="#2c2c3e" stroke="#d4af37" stroke-width="3" />

  <!-- Lens middle ring -->
  <circle cx="340" cy="187" r="38" fill="#1a1a2e" stroke="#888" stroke-width="1.5" />

  <!-- Lens glass -->
  <circle cx="340" cy="187" r="26" fill="#0d1b3e" />

  <!-- Lens highlight -->
  <ellipse cx="330" cy="178" rx="8" ry="5" fill="rgba(255,255,255,0.15)" />
  <circle cx="348" cy="193" r="3" fill="rgba(255,255,255,0.08)" />

  <!-- Flash / top detail -->
  <rect x="252" y="128" width="28" height="16" rx="4" fill="#d4af37" />

  <!-- ML text -->
  <text x="340" y="305" text-anchor="middle" class="logo-text" font-size="52" font-weight="700" fill="#1a1a2e" letter-spacing="8">ML</text>

  <!-- Decorative line left -->
  <line x1="195" y1="325" x2="280" y2="325" stroke="#d4af37" stroke-width="1.5" />

  <!-- Decorative line right -->
  <line x1="400" y1="325" x2="485" y2="325" stroke="#d4af37" stroke-width="1.5" />

  <!-- Tagline -->
  <text x="340" y="355" text-anchor="middle" class="tagline" font-size="11" fill="#888" letter-spacing="6">PHOTOGRAPHY</text>
</svg>
